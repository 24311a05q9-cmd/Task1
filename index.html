<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Advanced Styling & JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Advanced Styling and JavaScript</h1>
</header>
<section class="container">
    <h2>Responsive Web Page</h2>
    <p>
        This webpage adjusts automatically for mobile, tablet, and desktop
        using CSS Media Queries.
    </p>
</section>
<section>
    <h2>Image Carousel</h2>
    <div class="slider">
        <button onclick="prevSlide()">❮</button>
        <img id="sliderImage"
        src="https://picsum.photos/id/1015/700/400">
        <button onclick="nextSlide()">❯</button>
    </div>
</section>
<section class="api-section">
    <h2>Random Joke API</h2>
    <button onclick="getJoke()">Get Joke</button>
    <p id="joke"></p>
</section>
<script src="script.js"></script>
</body>
</html>
